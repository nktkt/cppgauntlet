name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  binary:
    name: Binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Verify report schema compatibility
        run: bash scripts/verify-report-schema-compat.sh

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          if [[ "$version" != v* ]]; then
            version="manual-${GITHUB_RUN_NUMBER}"
          fi

          arch="$(uname -m)"
          name="cppgauntlet-${version}-${{ matrix.platform }}-${arch}"
          staging="dist/${name}"
          archive="dist/${name}.tar.gz"
          checksum="${archive}.sha256"

          mkdir -p "$staging"
          cp target/release/cppgauntlet "$staging/"
          strip "$staging/cppgauntlet" 2>/dev/null || true
          cp README.md LICENSE "$staging/"
          cp docs/INSTALLATION.md docs/RELEASE.md "$staging/"

          tar -C dist -czf "$archive" "$name"
          if command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Generate release SBOM
        id: sbom
        shell: bash
        run: |
          set -euo pipefail
          sbom="dist/${{ steps.package.outputs.name }}.cdx.json"
          bash scripts/generate-release-sbom.sh "$sbom"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"

      - name: Attest release artifacts
        id: attest
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.sbom.outputs.sbom }}

      - name: Name attestation bundle
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          provenance="dist/${{ steps.package.outputs.name }}.intoto.jsonl"
          cp "${{ steps.attest.outputs.bundle-path }}" "$provenance"
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          notes="dist/${{ steps.package.outputs.name }}-release-notes.md"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -X POST \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f target_commitish="${GITHUB_SHA}" \
              -f configuration_file_path=".github/release.yml" \
              --jq '.body' > "$notes"
          else
            {
              echo "Manual CppGauntlet release build."
              echo
              echo "Commit: ${GITHUB_SHA}"
            } > "$notes"
          fi

          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.sbom.outputs.sbom }}
            ${{ steps.provenance.outputs.provenance }}
            ${{ steps.release_notes.outputs.notes }}

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" \
              --title "$tag" \
              --notes-file "${{ steps.release_notes.outputs.notes }}" \
            || gh release view "$tag" >/dev/null

          gh release upload "$tag" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}" \
            "${{ steps.sbom.outputs.sbom }}" \
            "${{ steps.provenance.outputs.provenance }}" \
            --clobber
