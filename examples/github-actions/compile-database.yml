name: CppGauntlet compile database

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cppgauntlet:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CPPGAUNTLET_TARGET: build/compile_commands.json
      CPPGAUNTLET_CONFIGURE_COMMAND: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      CPPGAUNTLET_REPORT: .cppgauntlet/cppgauntlet-report.json
      CPPGAUNTLET_MARKDOWN: .cppgauntlet/cppgauntlet-report.md
      CPPGAUNTLET_CLANG_TIDY: "true"
      CPPGAUNTLET_MAX_WARNINGS: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy cmake ninja-build

      - name: Install CppGauntlet
        run: cargo install --git https://github.com/nktkt/cppgauntlet

      - name: Generate compile database
        if: env.CPPGAUNTLET_CONFIGURE_COMMAND != ''
        shell: bash
        run: bash -lc "$CPPGAUNTLET_CONFIGURE_COMMAND"

      - name: Run CppGauntlet compile database check
        id: cppgauntlet
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .cppgauntlet
          args=(
            check "$CPPGAUNTLET_TARGET"
            --report "$CPPGAUNTLET_REPORT"
            --markdown-report "$CPPGAUNTLET_MARKDOWN"
          )
          if [ "$CPPGAUNTLET_CLANG_TIDY" = "true" ]; then
            args+=(--clang-tidy)
          fi
          if [ -n "$CPPGAUNTLET_MAX_WARNINGS" ]; then
            args+=(--max-warnings "$CPPGAUNTLET_MAX_WARNINGS")
          fi
          cppgauntlet "${args[@]}"

      - name: Upload CppGauntlet artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppgauntlet-compile-database
          path: |
            .cppgauntlet/cppgauntlet-report.json
            .cppgauntlet/cppgauntlet-report.md
          if-no-files-found: warn

      - name: Fail on CppGauntlet gate
        if: steps.cppgauntlet.outcome == 'failure'
        run: exit 1
