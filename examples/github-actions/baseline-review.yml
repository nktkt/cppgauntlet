name: CppGauntlet baseline review

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cppgauntlet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read

    env:
      CPPGAUNTLET_TARGET: path/to/main.cpp
      CPPGAUNTLET_BASELINE: .cppgauntlet/baseline.json
      CPPGAUNTLET_REPORT: .cppgauntlet/cppgauntlet-report.json
      CPPGAUNTLET_MARKDOWN: .cppgauntlet/cppgauntlet-report.md
      CPPGAUNTLET_BASELINE_CANDIDATE: .cppgauntlet/baseline.candidate.json
      CPPGAUNTLET_BASELINE_SUMMARY: .cppgauntlet/baseline-update.md

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install CppGauntlet
        run: cargo install --git https://github.com/nktkt/cppgauntlet

      - name: Verify baseline exists
        run: test -f "$CPPGAUNTLET_BASELINE"

      - name: Run CppGauntlet against baseline
        id: cppgauntlet
        continue-on-error: true
        run: |
          mkdir -p .cppgauntlet
          cppgauntlet check "$CPPGAUNTLET_TARGET" \
            --sanitizers none \
            --baseline "$CPPGAUNTLET_BASELINE" \
            --fail-on-new-diagnostics \
            --report "$CPPGAUNTLET_REPORT" \
            --markdown-report "$CPPGAUNTLET_MARKDOWN"

      - name: Build baseline candidate
        if: always() && hashFiles('.cppgauntlet/cppgauntlet-report.json') != ''
        run: |
          cppgauntlet --format markdown baseline update \
            --report "$CPPGAUNTLET_REPORT" \
            --previous "$CPPGAUNTLET_BASELINE" \
            --output "$CPPGAUNTLET_BASELINE_CANDIDATE" \
            > "$CPPGAUNTLET_BASELINE_SUMMARY"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppgauntlet-baseline-review
          path: |
            .cppgauntlet/cppgauntlet-report.json
            .cppgauntlet/cppgauntlet-report.md
            .cppgauntlet/baseline.candidate.json
            .cppgauntlet/baseline-update.md
          if-no-files-found: warn

      - name: Comment baseline summary
        if: always() && github.event_name == 'pull_request' && hashFiles('.cppgauntlet/baseline-update.md') != ''
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- cppgauntlet-baseline-review -->";
            const summaryPath = process.env.CPPGAUNTLET_BASELINE_SUMMARY;
            const summary = fs.readFileSync(summaryPath, "utf8").trim();
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "## CppGauntlet Baseline Review",
              "",
              summary,
              "",
              `Download the \`cppgauntlet-baseline-review\` artifact from [this workflow run](${runUrl}) to inspect the full report and candidate baseline.`
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const previous = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail on new diagnostics
        if: steps.cppgauntlet.outcome == 'failure'
        run: exit 1
