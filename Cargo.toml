[package]
name = "cppgauntlet"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "A Rust-powered C++ verification gauntlet"
repository = "https://github.com/nktkt/cppgauntlet"
homepage = "https://github.com/nktkt/cppgauntlet"
documentation = "https://github.com/nktkt/cppgauntlet/tree/main/docs"
readme = "README.md"
license = "MIT"
keywords = ["cpp", "clang", "llvm", "ci", "testing"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "ROADMAP.md",
    "docs/**",
    "examples/**",
    "src/**",
    "tests/**",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
thiserror = "1.0"
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
